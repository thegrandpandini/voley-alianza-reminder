name: Sincronizar partidos de Alianza Lima

# Corre todos los días a las 12:00 UTC = 07:00 en Lima.
# El cron de GitHub Actions puede atrasarse unos minutos; no importa, porque
# los avisos viven en el calendario (Apple o Google) una vez creados.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:        # botón "Run workflow" para probar a mano
  push:
    branches: [main]
    paths:
      - "voley/**"
      - "sync.py"
      - ".github/workflows/sync.yml"

permissions:
  contents: write           # para guardar el .ics actualizado en el repo

concurrency:
  group: voley-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Configuración opcional desde Settings -> Secrets and variables -> Actions
    # -> pestaña "Variables". Si no defines ninguna, se usan los valores por
    # defecto de voley/config.py. Las que falten llegan vacías y el código las
    # ignora (por eso config.py trata "" como "sin definir").
    env:
      VOLEY_TEAM_ID: ${{ vars.VOLEY_TEAM_ID }}
      VOLEY_LEAGUE_ID: ${{ vars.VOLEY_LEAGUE_ID }}
      VOLEY_REMINDERS: ${{ vars.VOLEY_REMINDERS }}
      VOLEY_CALENDAR_ID: ${{ vars.VOLEY_CALENDAR_ID }}
      VOLEY_LOOKAHEAD_DAYS: ${{ vars.VOLEY_LOOKAHEAD_DAYS }}
      VOLEY_TRANSPARENCY: ${{ vars.VOLEY_TRANSPARENCY }}
      VOLEY_DISPLAY_TZ: ${{ vars.VOLEY_DISPLAY_TZ }}

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- Credenciales de Google (opcional) --------------------------------
      # Si NO configuraste Google Calendar, este paso no hace nada y el resto
      # sigue funcionando: sólo se actualiza el archivo .ics.
      - name: Detectar credenciales de Google
        id: creds
        env:
          TOKEN_JSON: ${{ secrets.VOLEY_TOKEN_JSON }}
        run: |
          if [ -n "$TOKEN_JSON" ]; then
            printf '%s' "$TOKEN_JSON" > token.json
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "token.json listo ($(wc -c < token.json) bytes)"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Sin credenciales de Google: sólo se actualizará el .ics."
          fi

      - name: Ver los próximos partidos
        run: python sync.py check

      - name: Sincronizar con Google Calendar
        if: steps.creds.outputs.present == 'true'
        run: python sync.py sync

      - name: Generar el archivo .ics
        run: python sync.py ics

      - name: Guardar el .ics en el repositorio
        id: save
        run: |
          if [ -n "$(git status --porcelain docs/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/
            git commit -m "chore: actualizar calendario .ics"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en el .ics."
          fi

      # GARANTIA ANTI-60-DIAS.
      # Fuera de temporada no hay partidos, el .ics queda identico byte a byte y
      # no habria commits. GitHub desactiva los workflows programados tras 60
      # dias sin actividad en el repo, y NO se reactivan solos: el robot moriria
      # durante el receso (abril -> septiembre).
      # Este latido asegura al menos un commit al dia, siempre.
      - name: Latido diario para no quedar inactivo
        if: steps.save.outputs.changed == 'false'
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat.txt
          git commit --allow-empty -m "chore: latido diario (temporada baja)"
          git push
          echo "Sin partidos nuevos: deje un latido para mantener el workflow activo."

      - name: Resumen del día
        if: always()
        run: |
          echo "## Partidos de Alianza Lima" >> "$GITHUB_STEP_SUMMARY"
          python sync.py check >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
